name: Daily Video Sync

on:
  schedule:
    # Runs at 00:00, 08:00, 16:00 UTC (3 times a day, 8 hours apart)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit history.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Ensure FFmpeg is available
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed: $(ffmpeg -version | head -n 1)"
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: ${{ runner.os }}-whisper-small-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Orchestrator
        env:
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
          BILIBILI_BILI_JCT: ${{ secrets.BILIBILI_BILI_JCT }}
          BILIBILI_BUVID3: ${{ secrets.BILIBILI_BUVID3 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          REMOTE_VIDEO_URL: "https://chat.ainewskit.com/mp3tomp4/"
        run: python -m src.main

      - name: Commit history
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add history.json
          git commit -m "Update download history" || echo "No changes to commit"
          git push
